name: CI

# 成本约束（重要）
# ─────────────────────────────────────────────────────────────
# 私有仓库的 GitHub-hosted runner 计费倍率：Linux 1× / Windows 2× / macOS 10×
# 本仓是 .NET / WPF，只能跑 windows-latest —— 2× 计费。
# 所以：能在本地跑的一律不要放 CI。推送前请先跑 scripts/precheck.ps1。
#
# 本仓没有 iOS job，也不需要：电脑端不涉及 macOS 构建。
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  dotnet:
    name: .NET (build / test)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 显示 SDK 版本
        run: dotnet --info

      # ─────────────────────────────────────────────
      # windows-latest 镜像里**没有** FFmpeg，而本仓的
      # FfmpegIntegrationTests 全靠它。不装的话那十几条测试会被
      # RequiresFfmpegFact 静默跳过 —— CI 照样绿，但编码探测、remux、
      # 解码校验这三件最该被验证的事一件都没验。
      # 这是「看起来完成了」，比 CI 红更贵。
      #
      # 刻意不在 Linux 上跑这些测试：编码能力探测的结果本身就是
      # 机器相关的（QSV/NVENC/AMF 各自要看显卡），在 Linux 上验等于没验。
      # ─────────────────────────────────────────────
      - name: 安装 FFmpeg
        run: |
          choco install ffmpeg -y --no-progress
          $ffmpeg = (Get-Command ffmpeg -ErrorAction SilentlyContinue).Source
          if (-not $ffmpeg) { throw '装了 FFmpeg 但 PATH 上找不到' }
          "FFMPEG_EXE=$ffmpeg" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "FFmpeg: $ffmpeg"
          & $ffmpeg -version | Select-Object -First 1

      - name: 还原
        run: dotnet restore

      - name: 构建（Release）
        run: dotnet build -c Release --no-restore

      # 自带守卫：任何测试被跳过就让 job 红。
      # 理由同上 —— 跳过的测试会让 CI 变成一种虚假的安心。
      - name: 测试（含打真 FFmpeg 的集成测试）
        run: |
          $output = & dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx" 2>&1 | Out-String
          Write-Host $output

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet test 失败（退出码 $LASTEXITCODE）"
          }

          # 中英文输出都拦
          if ($output -match '(Skipped|已跳过)\D+([1-9]\d*)') {
            throw "有测试被跳过（跳过数 $($Matches[2])）—— CI 绿了但那些测试什么都没验，先查为什么跳。"
          }

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: '**/TestResults/**/*.trx'
          if-no-files-found: ignore
