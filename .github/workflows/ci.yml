name: CI

# 成本约束（重要）
# ─────────────────────────────────────────────────────────────
# 私有仓库的 GitHub-hosted runner 计费倍率：Linux 1× / Windows 2× / macOS 10×
# 本仓是 .NET / WPF，只能跑 windows-latest —— 2× 计费。
# 所以：能在本地跑的一律不要放 CI。推送前请先跑 scripts/precheck.ps1。
#
# 本仓没有 iOS job，也不需要：电脑端不涉及 macOS 构建。
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

  # 网络摄像头那一组的**类名**，`--filter` 用。两个变量是一对：
  # 跑全量时排除它们、单独一步跑它们（为什么要拆开，见下面那一步的注释）。
  # ⚠️ 加了新类要**两边都改** —— 只改一处的话那组会在两个步骤里各跑一次
  #（用例数一眼看得出），不会静默漏掉，所以这个名单还算安全。
  #
  # ⚠️ `PreviewProcess` 是 2026-10-05 补进来的，补之前它**不在名单里**：
  # 那个类里有 **2 条 `[RequiresRtspFact]`**，于是它们跑在**全量**那一步，
  # 跟一千多条并排 —— 而拆两步的唯一理由就是不让这一组跟别人抢 CPU。
  # 这正是上面那句「名单会走岔」的又一次实例（漏的是名字最不像的那个）。
  # 判据不是「看类名像不像」，是：**哪个类里有 RequiresRtspFact，就得在这个名单里**
  #（`grep -c "\[RequiresRtspFact" tests/**/*.cs` 一把就能对出来）。
  #
  # ⚠️ 2026-10-06 又想起一个候选，**结论是不放**，理由留在这儿免得下次重新想一遍：
  # `LiveTileProcessTests` 也起真 ffmpeg、也在满负载下偶发红过一次，看着该进来 ——
  # 但它没有 `RequiresRtspFact`，塞进来会让上面那条判据**变假**（判据是防名单走岔的
  # 唯一机制，比这一个用例值钱）。而且它跟 `PreviewThroughput` **不同因**：它跑的是
  # `testsrc=size=320x240:rate=10`，跟 1080p 实时编解码抢 CPU 那件事无关。
  #
  # ⚠️ 它那条偶发的**根因还没查明**。这里特别留一句提醒：**别照我写这行字时先前那句
  # 「时间预算紧」去改** —— 那句没有实测支撑，而且本机实测**正相反**：这条只要 **11 秒**
  #（窗口是 30 秒，余量三倍）。CI 上那次却是 30 秒超时 ⇒ 那不是「慢一点」，是**真卡住了**。
  # 要治它得先抓到卡在哪一步（该在用例里加现场，不在这名单）。
  CAMERA_FILTER: 'FullyQualifiedName~NetworkCamera|FullyQualifiedName~Prerecord|FullyQualifiedName~RecordingPreview|FullyQualifiedName~PreviewThroughput|FullyQualifiedName~PreviewProcess'
  NON_CAMERA_FILTER: 'FullyQualifiedName!~NetworkCamera&FullyQualifiedName!~Prerecord&FullyQualifiedName!~RecordingPreview&FullyQualifiedName!~PreviewThroughput&FullyQualifiedName!~PreviewProcess'

jobs:
  dotnet:
    name: .NET (build / test)

    # ─────────────────────────────────────────────
    # 跑在哪台机器上 —— **`pull_request` 不许落到那台笔记本上**（2026-10-05）。
    #
    # 那台 `vidlog-laptop` 是真有摄像头、有 ffmpeg 的机器，`vidlog-cam` 是它
    # 自己的标签（`config.cmd --labels`）。本仓是 **public**：如果 PR 也能落上去，
    # 任何人 fork 一下开个 PR，就能让**他提交的代码**在那台笔记本上执行 ——
    # 而那台是你自己的工作机（有真实录像、登着 GitHub）。GitHub 专门警告过这个
    # 攻击面（self-hosted runner on a public repo）。
    #
    # 所以只有**自己推的**和**手动点的**才上笔记本；PR 留在 GitHub 托管的 runner
    # 上（public 仓的托管 runner 不计费，所以这道闸不要钱）。
    #
    # ⚠️ 换机器、或改 runner 标签，这一行与上面的说明一起改。
    # ─────────────────────────────────────────────
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'vidlog-cam' || 'windows-latest' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 必须在 setup-dotnet **之前**跑（2026-10-05 在 vidlog-laptop 上实测）：
      # `actions/setup-dotnet` **没有** `install-dir` 这个输入 —— 加了只会得到一条
      # 「Unexpected input(s) 'install-dir'」警告然后被**忽略**，它照样往默认的
      # `C:\Program Files\dotnet` 装。而自托管 runner 是普通用户，写不进去，
      # 整个作业卡在第三步：
      #     The current user doesn't have write access to the installation root
      # 官方 README 给自托管场景的正解就是这个环境变量（装到谁都写得进的地方），
      # 而且明确要求用 `$GITHUB_ENV` 在 setup 步骤之前设。
      - name: 把 .NET 装到写得进去的地方
        run: |
          "DOTNET_INSTALL_DIR=$env:RUNNER_TEMP\dotnet" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 显示 SDK 版本
        run: dotnet --info

      # ─────────────────────────────────────────────
      # windows-latest 镜像里**没有** FFmpeg，而本仓的
      # FfmpegIntegrationTests 全靠它。不装的话那十几条测试会被
      # RequiresFfmpegFact 静默跳过 —— CI 照样绿，但编码探测、remux、
      # 解码校验这三件最该被验证的事一件都没验。
      # 这是「看起来完成了」，比 CI 红更贵。
      #
      # ⚠️ 但**先看 PATH**：自托管那台笔记本上 ffmpeg 早装好了，而
      # `choco install` **要管理员**、runner 一般是普通用户 ⇒ 会红，
      # 红得还像「环境坏了」，其实只是白装一遍。有就直接用。
      #
      # 刻意不在 Linux 上跑这些测试：编码能力探测的结果本身就是
      # 机器相关的（QSV/NVENC/AMF 各自要看显卡），在 Linux 上验等于没验。
      # ─────────────────────────────────────────────
      - name: 准备 FFmpeg
        run: |
          $ffmpeg = (Get-Command ffmpeg -ErrorAction SilentlyContinue).Source
          if (-not $ffmpeg) {
            choco install ffmpeg -y --no-progress
            $ffmpeg = (Get-Command ffmpeg -ErrorAction SilentlyContinue).Source
          }
          if (-not $ffmpeg) { throw 'FFmpeg 既没装、也没装成（choco 要管理员）—— 这台机器上那些集成测试跑不了' }
          "FFMPEG_EXE=$ffmpeg" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "FFmpeg: $ffmpeg"
          & $ffmpeg -version | Select-Object -First 1

      - name: 还原
        run: dotnet restore

      - name: 构建（Release）
        run: dotnet build -c Release --no-restore

      # ⚠️ 全量这一步**放在造源之前**是刻意的：它不需要那个源。
      # 它是这里最宽的一道闸，让它先跑 —— 否则摄像头组一旦红，这一轮就再也
      # 看不到「全量到底绿不绿」，而那条信号比摄像头组的值钱。
      - name: 测试（全量，不含网络摄像头组）
        run: |
          $output = & dotnet test -c Release --no-build `
            --filter "$env:NON_CAMERA_FILTER" `
            --logger "trx;LogFileName=results.trx" 2>&1 | Out-String
          Write-Host $output

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet test 失败（退出码 $LASTEXITCODE）"
          }

      # ─────────────────────────────────────────────
      # 造一个假的网络摄像头源：把那 15 条 RequiresRtspFact 从「永远跳过」
      # 变成「真的跑」。
      #
      # 为什么是**造**的不是**借**的：那些用例要一个真的网络源，而 GitHub 的
      # runner 既没有摄像头、也进不了任何内网。借真设备更糟 —— 那台手机 IP 摄像头
      # 是**单客户端**的（`-listen 1`），CI 每跑一次就去连一次，会把它打死。
      # 而 ffmpeg 自己又当不了 RTSP 服务端（实测：rtsp 复用器**没有** listen
      # 开关，它会把 URL 当客户端去连）。
      #
      # ⚠️ 所以这条路走的是**非 RTSP 分支**（`CameraSource.IsRtsp` 只看 URL 协议）
      # —— `-rtsp_transport tcp` 那条分支 CI 上仍然盖不到，要盖得另装一个真
      # RTSP 服务端。别把这一步当成「RTSP 全验过了」。
      #
      # 脚本在 `scripts/fake-network-camera.py`，本地同样能用（文件头有用法）。
      # ─────────────────────────────────────────────
      #
      # ⚠️ `!cancelled()`，**不是** `always()`：全量那一步偶发一红时，别把这一组
      # 整个 skip 掉 —— 这一组的结论最需要每次都看到（2026-10-06 那次全量偶发
      # 就是正好把 14 条 RTSP 用例的结论挡掉了，那一轮等于白跑）。
      # 不用 `always()` 是因为它在**手动取消**时也返回真 —— 你都按了取消，
      # 它还要再起一轮测试。下面「收掉假源」继续用 `always()` 是对的：
      # 取消时更要把假源收干净，那是另一回事。
      - name: 测试（网络摄像头组 —— 造源，然后对着它真跑）
        if: ${{ !cancelled() }}
        run: |
          # ─────────────────────────────────────────────
          # 挑解释器：判据是「**它真能跑**」，不是「找得到」。
          #
          # ⚠️ 2026-10-05 在 vidlog-laptop 上踩出来的，代价是四轮 CI：
          # 那台机器上 `python` 是个**微软商店的占位壳**
          #（`%LOCALAPPDATA%\Microsoft\WindowsApps\python.exe`）——
          # 它**找得到**（`Get-Command` 有结果），但**什么也不执行、一个字符也不打印**。
          # 于是这段代码挑中了它 ⇒ 脚本从没跑起来 ⇒ 而那 15 条用例照样「绿」。
          # 更难看的是：这条注释本来就在提醒「`python` 经常只是商店的占位壳」，
          # 而代码只判了「找不找得到」—— 写了，自己没照做。
          #
          # 所以判据必须**能失败**：拿一句 print 真跑一下，有输出才算数。
          # 商店壳不会打印任何东西，也过不了这一关。
          # ─────────────────────────────────────────────
          function Test-Python([string]$exe) {
            if (-not $exe) { return $false }
            $out = & $exe -c "print('ok')" 2>$null
            return ($LASTEXITCODE -eq 0) -and ("$out" -match 'ok')
          }

          $py = (Get-Command python -ErrorAction SilentlyContinue).Source
          if (-not (Test-Python $py)) { $py = (Get-Command py -ErrorAction SilentlyContinue).Source }
          if (-not (Test-Python $py)) {
            throw 'runner 上没有一个能真跑的 python —— `python`/`py` 要么不存在、要么是微软商店的占位壳'
          }
          Write-Host "假源用的解释器: $py"
          & $py -V

          # 端口预检：8081 上已经有人（多半是上一次没收干净的假源）就直接红。
          #
          # ⚠️ 少了这一条，两个源会**各绑各的**（见上），连到谁身上看运气 ——
          # 表现是「有时绿有时红、红在很深的用例里」，极难查。
          # 只看 LISTENING，不看 TIME_WAIT：上一次跑完留下的 TIME_WAIT 无害，
          # 按它判就会把一次正常的重跑误伤成红。
          if (netstat -ano | Select-String ':8081\s.*LISTENING') {
            throw '8081 上已经有东西在监听了（多半是上一次没收干净的假源）—— 先把它收掉再跑'
          }

          $log = "$env:RUNNER_TEMP\fake-camera.log"
          # `-u` 是**必须的**：stdout 被重定向到文件时会变成块缓冲，
          # 下面那行「我起来了」会被憋在缓冲区里，这份日志就永远读不到 ——
          # 排查那四轮 CI 时打出来的日志文件一直是**空的**，就是这个原因。
          $proc = Start-Process -FilePath $py -PassThru -WindowStyle Hidden `
            -ArgumentList '-u', 'scripts/fake-network-camera.py', '--port', '8081' `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          "FAKE_CAMERA_PID=$($proc.Id)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

          # ─────────────────────────────────────────────
          # 就绪判据：**我们的进程自己说它起来了**，而不是「8081 上有人应声」。
          #
          # ⚠️ 原来的写法是 `TcpClient` 连一下 8081，连上就算就位。那条判据**测错了东西**：
          # 它只问「这个端口有没有人接」，**不问接的是不是我们**。2026-10-05 那次
          # 「假源已就位」（1.8 秒就绪）就是**假绿** —— 当时 8081 上接的是别的残留，
          # 我们那个源**一个字节都没发过**，而 CI 照样往下跑，
          # 撞上真源的那两条用例随即以 Assert.NotNull 红掉。这正是本仓最防的
          # 「有人应声所以绿」。
          #
          # 现在的判据问的是「**是不是我们**」：日志里出现脚本自己那句
          # `fake network camera serving` 才算数 —— 商店壳那种「起来了其实什么都没干」
          # 再也混不过去。
          #
          # ⚠️ 但**光看日志不够**：脚本是先 print 再 bind 的，所以还得**同时**要求进程
          # 还活着（`-not $proc.HasExited`）—— 万一它打完这句就崩，也算没起来。
          #
          # ⚠️ 这条判据**盖不住**下面这种情况，别当成已经有了（本机实测出来的）：
          # 8081 上已经蹲着别的东西时，脚本**不会死**。`allow_reuse_address = True`
          # 就是 `SO_REUSEADDR`，而**在 Windows 上它允许第二个 socket 也 bind 同一个
          # 端口**（实测：两个实例同时活着、各自都打印了「serving」，连到谁身上没定义）。
          # 所以「别人占着 ⇒ 我们的进程会死」是**错的**——真正的兜底是下面那道端口预检。
          #
          # 留 60 秒：片子没缓存时它得先编码 750 帧 1080p（那台笔记本上要几分钟，
          # 所以 CI 上更常见的失败是**预算不够**而不是脚本坏了 —— 日志会说明是哪种）。
          # ─────────────────────────────────────────────
          # ⚠️ 两条**都要**：说过（日志里那句）**而且真在听**（netstat）。
          #
          # 只看日志有个洞，是我自己留的：脚本是**先 print 再 bind**，
          # 所以「日志里有那句话」+「进程还活着」这两条在 bind **之前**就已经同时
          # 成立了 —— 「说了要起、其实压根没绑上」照样放行。这正是本步要防的
          # 那类假绿，换了个位置又长出来一次。补上 netstat 才算闭合。
          #
          # 上面那道端口预检保证了**开工前 8081 上没人**，所以此刻任何一条
          # LISTENING 都是我们自己的，不用去比对 PID。
          $up = $false
          foreach ($i in 1..120) {
            if ($proc.HasExited) {
              Get-Content $log, "$log.err" -ErrorAction SilentlyContinue | Write-Host
              throw "假源进程已经退出（退出码 $($proc.ExitCode)）—— 看上面那两份日志"
            }
            if ((Select-String -Path $log -Pattern 'fake network camera serving' -Quiet -ErrorAction SilentlyContinue) -and
                (netstat -ano | Select-String ':8081\s.*LISTENING')) {
              $up = $true
              break
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $up) {
            Get-Content $log, "$log.err" -ErrorAction SilentlyContinue | Write-Host
            netstat -ano | Select-String ':8081'
            throw '假源 60 秒内没说它起来了、或者说了却没在 8081 上监听 —— 看上面那两份日志'
          }

          # ⚠️ 这两个**必须设在当前进程里**，不能只写 `GITHUB_ENV`：
          # `GITHUB_ENV` 只对**后续步骤**生效，同一步里写完立刻 `dotnet test`
          # 是**读不到**的 —— 那样测试会以为「没有源」，15 条全变跳过，
          # 比现在这版更坏（假绿）。写 `GITHUB_ENV` 那份是留给后面几步的
          #（「收掉假源」要按 `FAKE_CAMERA_PID` 杀）。
          $env:VIDLOG_TEST_RTSP_URL = 'http://127.0.0.1:8081'
          $env:VIDLOG_TEST_CAMERA_SIZE = '1920x1080'
          "VIDLOG_TEST_RTSP_URL=http://127.0.0.1:8081" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VIDLOG_TEST_CAMERA_SIZE=1920x1080"          | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host '假源已就位：http://127.0.0.1:8081'

          # ─────────────────────────────────────────────
          # 上面是「造源」，下面是「用它」—— 这两件事**必须在同一个步骤里**。
          #
          # ⚠️ 2026-10-06 实测：原来起源与用源分成两步、中间只隔了一步全量测试
          #（1 分钟），结果**要源的那 14 条一条不剩全红**，清一色
          # `Connection to tcp://127.0.0.1:8081 failed: Error number -138 occurred`
          #（连接被拒）；不要源的 26 条全绿。开工前打出来的现场是：日志停在启动
          # 那三行、`.err` **空**、端口上没人、进程也没了 —— 说明它是被**外部
          # 干净地收走**的，不是自己崩的（崩了 socketserver 会往 stderr 吐
          # traceback）。那段时间只有 runner 自己在动，所以最合理的解释是
          # **它在每一步结束时收掉该步的进程树**（作业结束时它会印
          # `Terminate orphan process`，日志里看得到）。并成一步之后，
          # 这件事就与它无关了 —— 源与用例同生共死。
          #
          # ⚠️ 这一组**单占一步**不是洁癖：它们是 1080p 的实时 x264 编解码，
          # 与其余一千多条并行时会互相抢 CPU（仓里早有记录：「并行时
          # PreviewThroughput 会读到 7 fps，判据要 ≥ 9」）。组内自己串行
          # （同一个 xunit collection），只要不跟别人并行就是稳的。
          #
          # ⚠️ 那个括号**不能省**：VSTest 的 `&` 比 `|` 结合**更紧**（2026-10-05
          # 实测），不加括号等于 `A|B|C|(D&!~连录十分钟)` —— 排除只落在最后一个
          # 分支上，那条十分钟的照样跑。加了才是 (A|B|C|D) 里排掉它。
          #
          # ⚠️ 「真机连录十分钟」那条**不在这儿跑** —— 一次 CI 多十分钟，它留在
          # 真机验收那一套里（这台机器上也不成立：假源是本地循环，不是真机）。
          # ─────────────────────────────────────────────
          $output = & dotnet test -c Release --no-build `
            --filter "($env:CAMERA_FILTER)&FullyQualifiedName!~连录十分钟" `
            --logger "trx;LogFileName=camera.trx" 2>&1 | Out-String
          Write-Host $output

          if ($LASTEXITCODE -ne 0) {
            # 红的时候把现场留下来：这一组几乎每个「红」都在问
            #「源那边到底怎么了」，而截图里只有断言消息。
            Write-Host '— 8081 的端口状态 —'
            netstat -ano | Select-String ':8081'
            Write-Host '— fake-camera.log —'
            Get-Content "$env:RUNNER_TEMP\fake-camera.log" -Tail 40 -ErrorAction SilentlyContinue | Write-Host
            Write-Host '— fake-camera.log.err —'
            Get-Content "$env:RUNNER_TEMP\fake-camera.log.err" -Tail 40 -ErrorAction SilentlyContinue | Write-Host
            throw "网络摄像头组失败（退出码 $LASTEXITCODE）"
          }

      # ⚠️ 必须收掉：托管 runner 上整台虚拟机作废、无所谓，但这台机器很可能是
      # **self-hosted**（那台笔记本）—— 进程会留在那儿，下次 CI 撞端口。
      # 只杀我们起的那个 PID：那台机器上可能还跑着别人的 python。
      #
      # ⚠️ 所以先看名字再杀。自从「造源」并进上一步之后，走到这儿**源多半已经
      # 死了**（它随那一步一起被收走），而这个 PID 就成了一把**指向已死编号的枪**
      # —— Windows 会复用 PID，几秒后那个号可能就是别人的进程。名字不对就不动手。
      - name: 收掉假源
        if: always()
        run: |
          if ($env:FAKE_CAMERA_PID) {
            $p = Get-Process -Id ([int]$env:FAKE_CAMERA_PID) -ErrorAction SilentlyContinue
            if ($p -and $p.ProcessName -like 'python*') {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
          }

      # 自带守卫：被跳过的测试会让 CI 变成一种虚假的安心，所以**意外**跳过必须红。
      #
      # ⚠️ 但不能一律按「跳过数 > 0 就红」写死。有一类跳过是**环境本来就跑不了**的：
      # 摄像头集成测试需要真设备，而 GitHub 的 runner 没有摄像头 ——
      # 这台机器上它真跑，CI 上必然跳。把它算成失败，等于要求 CI 有一条它
      # 无论如何都满足不了的规则。
      #
      # ── 判据：按**跳过原因里的标记**，不按类名列名单 ──────────────────
      #
      # ⚠️ 2026-09-29 从「类名名单」改成「原因标记」，因为名单**必然会走岔**：
      # 名单要写在**两个地方**（测试类上的特性 + 这里的字符串），
      # 而那一天之内就走岔了**两次** —— 都是「新加了一个用 Requires*Fact 的类，
      # 忘了改名单」，表现都是「测试全过、CI 必红」，排查还挺绕。
      # 现在新增一条允许项**只改测试自己那一处**（SkipMarker.Allow）。
      #
      # ⚠️ 标记只配用在「这台机器**本来就没有**这个设备/服务」上。
      # **「本该有、但这台机器没配好」的不许打** —— 最典型的是 RequiresFfmpegFact：
      # CI 会装 FFmpeg，它一旦跳过就说明**环境配错了**，必须红。所以 FFmpeg 那一组
      # 没有标记，CI 上少了 FFmpeg 照样立刻失败。
      # ⚠️ 这一步**不跑测试** —— 测试已经拆成上面两步（全量 / 网络摄像头组）。
      # 它只汇总那两步留下的 trx，判有没有**意外跳过**。放在这里是因为
      # 跳过守卫必须在两步都跑完之后才看得到全貌。
      - name: 守卫（有没有测试被意外跳过）
        if: always()   # 测试红了也要跑：跳过数正是排查的第一手线索
        run: |
          # 两步各自的 trx 名字不同（results.trx / camera.trx），所以是**收全部**
          # 而不是取第一个 —— 取第一个会只看得到全量那一步，摄像头组的跳过就此隐形。
          $trxFiles = @(Get-ChildItem -Path . -Recurse -Filter '*.trx' -ErrorAction SilentlyContinue)
          if ($trxFiles.Count -eq 0) { throw '一份测试结果都没有 —— 测试那两步多半没跑起来' }

          # Skip 的**原因**在 TRX 的 Output/ErrorInfo/Message 里（实测 2026-09-29）。
          $allowMarker = [regex]::Escape('[允许跳过]')

          $skipped = @()
          foreach ($trx in $trxFiles) {
            [xml]$results = Get-Content $trx.FullName
            $skipped += @($results.TestRun.Results.UnitTestResult |
                          Where-Object { $_.outcome -eq 'NotExecuted' })
          }

          $unexpected = @($skipped | Where-Object {
            "$($_.Output.ErrorInfo.Message)" -notmatch $allowMarker
          })
          if ($unexpected.Count -gt 0) {
            $names = ($unexpected | ForEach-Object { "$($_.testName)（原因：$($_.Output.ErrorInfo.Message)）" }) -join '; '
            throw "有 $($unexpected.Count) 个测试被意外跳过：$names —— CI 绿了但那些测试什么都没验，先查为什么跳。"
          }

          if ($skipped.Count -gt 0) {
            Write-Host "说明：$($skipped.Count) 个测试因本机环境限制跳过（CI 无摄像头 / 无内网 RTSP 源），已按标记放行。"
          }

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: '**/TestResults/**/*.trx'
          # ⚠️ 显式给个保留期（2026-09-27 加）。不给的话按仓库默认（90 天），
          # 而这份 trx 只在**这次跑挂掉时**才有用 —— 2026-09-27 那天
          # GitHub 的 artifact 配额被手机端的 APK 吃光，两端 CI 都红在
          # 「产物传不上去」，看起来像代码坏了。留 7 天足够回头看一次。
          retention-days: 7
          if-no-files-found: ignore
