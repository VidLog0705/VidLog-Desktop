name: 电脑端安装包

# ─────────────────────────────────────────────────────────────
# 手动触发，产出自包含的 win-x64 **安装程序**（setup.exe）。
# ⚠️ 0.14.1 起**不出 zip 了**（需求方 2026-10-14：「以后出包只出安装程序」）。
#
# ⚠️ 不要改成 push 触发。Windows runner 是 2× 计费（见 ci.yml 顶上那段），
#    每次推送都打一次包会迅速烧光额度。本地也能打：scripts/package.ps1。
#
# 与 ci.yml 的关系：**打包不重跑测试**。测试是 ci.yml 的事，这里只负责
# 「把这个提交变成一份能装到别人机器上的东西」—— 两件事分开，红的时候
# 一眼看得出是哪一件。
#
# ⚠️ 产物走 Release 而不是 upload-artifact：2026-09-27 起账号级 Actions
#    产物配额被拒过（`Artifact storage quota has been hit`），Release 资源
#    不占那个配额。手机端 ios-package.yml 同一个套路。
# ─────────────────────────────────────────────────────────────

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: package
  cancel-in-progress: false

jobs:
  package:
    name: Build win-x64 package
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 与 ci.yml 同一段：windows-latest 镜像里没有 FFmpeg，而这个包
      # **必须**带上它 —— FfmpegLocator 会从应用目录下的 tools\ 找，
      # 少了它装出来的是个半残的软件（能开、什么都干不了）。
      #
      # ⚠️ 这里与 ci.yml **故意不一样**：不能用 `(Get-Command ffmpeg).Source`。
      #    那是 `C:\ProgramData\chocolatey\bin` 下的**转发器**（shim，392 KB，
      #    里面按相对路径找 `..\lib\ffmpeg\...`），**在装过 choco 的机器上跑起来
      #    完全正常**，所以 CI 一路绿；而它拷进包里、到了别人机器上什么都不是。
      #    2026-10-01 第一次出包就是这么产出了一份 76 MB 的坏包。
      #    ci.yml 拿转发器没问题（那台机器装着 choco，它跑得起来）；
      #    这里要的是**能跟着包走的那个文件**，只能是 lib 下面真的那份。
      - name: 安装 FFmpeg
        run: |
          choco install ffmpeg -y --no-progress

          $real = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg" -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue |
                  Where-Object { $_.Length -gt 5MB } |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $real) { throw 'choco 装了 ffmpeg，但只找到转发器，没找到真的 ffmpeg.exe' }

          "FFMPEG_EXE=$real" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "随包的 FFmpeg：$real（$([math]::Round((Get-Item $real).Length / 1MB)) MB）"
          & $real -version | Select-Object -First 1

      # package.ps1 末尾还会**在包内**再验一次「换个位置跑不跑得起来」——
      # 上面这段是按路径猜，那一段是拿要发出去的东西实测。两道都要有。

      # 与上面 FFmpeg 同一段理由：包要「装完就能用」。百度网盘登录窗是内嵌的
      # WebView2 —— Windows 11 自带，**Windows 10 只在装过 Edge 或别的带 WebView2
      # 的软件之后才有**，客户机完全可能没有。0.14.1 起把运行时打进安装程序
      # （需求方 2026-10-14 拍板）。
      #
      # ⚠️ 用 **2124701（离线独立安装器，约 200MB）**，不是 2124703 那个 2MB 的
      #    bootstrapper：后者装的时候要联网，客户机断网/限速时那一步就挂着 ——
      #    正是这个包要避免的场面。代价是装机包从约 95MB 涨到约 300MB。
      #
      # ⚠️ 两个 fwlink 下回来的**是同一个文件名**，只差体积 ⇒ 不能只看 HTTP 200：
      #    拿到 bootstrapper 的话包照样打得出来，只在客户机断网时才露馅。
      #    所以按**体积 + 签名**验（与本地 H:\_installers 下那份实测一致：
      #    204.2 MB，`CN=Microsoft Corporation, O=Microsoft Corporation, …`）。
      - name: 下载 WebView2 离线运行时
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2124701' `
              -OutFile $exe -UseBasicParsing

          $size = (Get-Item $exe).Length
          if ($size -lt 100MB) {
            throw "下到的才 $([math]::Round($size / 1MB)) MB —— 那是 bootstrapper（2124703），不是离线包（2124701）"
          }

          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne 'Valid') { throw "签名状态是 $($sig.Status)，不是 Valid" }
          if ($sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "签名者不是 Microsoft：$($sig.SignerCertificate.Subject)"
          }

          "WEBVIEW2_RUNTIME_EXE=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "随包的 WebView2 运行时：$([math]::Round($size / 1MB)) MB，签名 $($sig.SignerCertificate.Subject)"

      # ⚠️ **版本必须钉在 6.4.3，不许用「装最新版」**：
      #    Inno Setup 自 6.5.0（2025-08-12）起引入商业许可，未授权的副本编译时
      #    会印一行 `Non-commercial use only`；而本产品是商业软件。
      #    6.4.3 是最后一个仍在纯宽松许可下的版本 —— 它自带的 license.txt 明写
      #    "Permission is granted to anyone to use this software for any purpose,
      #     including commercial applications"。
      #    哪天公司买了商业许可，把这里与下面那段断言一起换掉，并同步 AGENTS.md §11。
      - name: 装 Inno Setup 6.4.3（钉住的版本）
        run: |
          $ErrorActionPreference = 'Stop'

          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup-6.4.3.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          Write-Host ("下到 {0:N1} MB" -f ((Get-Item $exe).Length / 1MB))

          $p = Start-Process $exe -Wait -PassThru `
              -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS'
          if ($p.ExitCode -ne 0) { throw "Inno Setup 安装失败（退出码 $($p.ExitCode)）" }

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "装完了却没有 $iscc" }

          # ⚠️ 这条断言才是「钉住」的落点：镜像上换了包、或者哪天有人图省事改成
          #    choco 装最新版，这里会**当场红**，而不是悄悄出一个带商业许可横幅的包。
          #
          # ⚠️ 判法只能靠「让它真编一次、读 banner」—— 读文件属性是读不出来的：
          #    `ISCC.exe` **自己不带版本信息**，FileVersion / ProductVersion 恒为
          #    `0.0.0.0`（2026-10-14 本机把 6.4.3 与 6.7.3 各编一次实测，两版读数
          #    一模一样；同目录唯一有版本的 `isscint.dll`、`Setup.e32` 也不是产品版本）。
          #    旧断言正是读了 `FileVersion -notlike '6.4.*'` ⇒ **从写下那天起就没通过过**
          #    （package.yml 在那之后一次都没跑成，所以一直没露头）。
          #
          #    2026-10-14 实测 banner：6.4.3 印
          #    `Compiler engine version: Inno Setup 6.4.3`；6.7.3 印 `… 6.7.3`，
          #    并在**下一行多印 `Non-commercial use only`** —— 而且**照样 exit=0**
          #    （`Successful compile (0.719 sec)`）⇒ 靠退出码判不出来，只能读输出。
          # ⚠️ here-string 的内容行**也要跟代码同样缩进** —— 块标量里出现 0 缩进的行
          #    会直接把 YAML 结构打断（`[Setup]` 会被当成 flow sequence）。GitHub 解析时
          #    会按块内最小缩进统一 dedent，所以这里缩进多少、pwsh 收到的就是多少去掉了。
          $probe = Join-Path $env:RUNNER_TEMP 'iscc-version-probe.iss'
          @"
          [Setup]
          AppName=probe
          AppVersion=1.0
          DefaultDirName={tmp}\vlogprobe
          OutputBaseFilename=vlogprobe
          "@ | Set-Content -Path $probe -Encoding ASCII

          $banner = (& $iscc $probe 2>&1) -join "`n"
          Remove-Item (Join-Path $env:RUNNER_TEMP 'vlogprobe.exe') -ErrorAction SilentlyContinue
          if ($banner -notmatch 'Compiler engine version: Inno Setup (6\.4\.\d+)') {
            throw "ISCC 不是钉住的 6.4.x —— 6.5+ 带商业许可要求（AGENTS.md §11）。banner：`n$banner"
          }
          Write-Host "ISCC：$iscc（引擎 $($Matches[1])）"

          "ISCC_EXE=$iscc" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: 打包
        run: ./scripts/package.ps1

      - name: 发到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          # `gh release view` 在标签还不存在时是**非零退出**，那是预期的一条路
          # （第一次跑就是这个情况），不是错误。新版 pwsh 会把原生命令的非零退出
          # 也当异常抛，所以先关掉那个行为，下面按退出码自己判。
          $PSNativeCommandUseErrorActionPreference = $false

          # ⚠️ 0.14.1 起**只发安装程序**（需求方 2026-10-14：「以后出包只出安装程序，
          #    zip 不出」）。绿色包装不到 Program Files、也注册不了那条回放许可 ——
          #    而那正是「手机连不上这台电脑」的两个成因，现场还分不清是没装对还是坏了。
          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw '没产出安装程序 —— scripts/package.ps1 没跑成' }
          Write-Host "安装程序：$($setup.Name)"

          # ⚠️ 标签**必须是版本号本身**，不能是一个固定的名字。
          # 客户端「关于」页的更新检查读的就是 `tag_name`（`ReleaseFeed.cs`），
          # 固定 `desktop-package` 时那一栏印出来的是「已是最新（desktop-package）」
          # —— 一句没有任何版本信息的废话（2026-10-02 实测报上来的）。
          # 版本号从**安装程序的名字**里取（`installer\VidLog.iss` 的
          # `OutputBaseFilename=VidLog-Desktop-{#AppVersion}-win-x64-setup`，
          # 而那个 `{#AppVersion}` 的唯一来源仍是 csproj），
          # 取不到就**当场失败**：宁可不出包，也不出一个版本号是假的的包。
          $version = if ($setup.BaseName -match '\d+\.\d+\.\d+') { $Matches[0] } else { $null }
          if (-not $version) { throw "从 $($setup.Name) 里取不到版本号，包名不合规" }

          # 同一个版本号重复打包就**覆盖**（标签已存在时走 upload --clobber）。
          # 每次覆盖 —— Release 页永远只有最新那一份。历史版本靠本地 dist\ 留档。
          $tag = "v$version"
          Write-Host "版本：$version（标签 $tag）"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease `
              --title '电脑端安装包' `
              --notes '安装程序：装到 Program Files，**并注册回放地址的访问许可**（手机才连得上这台电脑），要管理员权限。自包含，不需要先装 .NET 运行时。同一个版本号重复打包会覆盖这一份。'
          }
          gh release upload $tag $setup.FullName --clobber
          Write-Host "下载页：${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag"

      # ⚠️ 用户下载源是 AtomGit（公开仓 Vidlog/vidlog-releases，匿名 7.76 MB/s、
      #    支持断点续传），但**这一步不能放在 CI 里做** —— 2026-10-17 实测：
      #    托管 runner 在境外，往 AtomGit 上行只有 **0.04 MB/s**（8 MB 传了 200 秒），
      #    300 MB 要两小时，整步挂了 26 分钟被 30 分钟超时取消。
      #    本机同一条链路是 4.5 MB/s（314 MB / 73 秒）。
      #
      #    出包后在本机跑：`pwsh -File scripts/publish-atomgit.ps1`
      #    （缺 ATOMGIT_TOKEN 时会直接报错，不会静默跳过。）
      #
      #    ⚠️ 别「优化」成跑到 self-hosted runner 上就以为解决了 —— 那台机器
      #    得恰好在发布时在线；先按本机脚本走了两次再说。
